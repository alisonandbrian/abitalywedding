<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food &amp; Drinks Info</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            line-height: 1.6;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Message Box Styling */
        .info-box {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(26, 43, 76, 0.08);
            margin-bottom: 35px;
            text-align: left;
        }

        .info-box p {
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: 16px;
            line-height: 1.7;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        /* Back Link Button */
        .btn-back {
            display: inline-block;
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(26, 43, 76, 0.2);
            transition: transform 0.2s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Food & Drinks Announcement -->
        <div class="info-box">
            <p>There will be wine and champagne, we know that for sure.</p>
            <p>However, the food menu has yet to be decided. We will reach out closer to the date once the options have been selected so that you may make your selection.</p>
            <p>This page will be updated then.</p>
            <p>Thank you!</p>
        </div>

        <!-- Back Link to Main Page -->
        <div>
            <a href="index.html" class="btn-back">&larr; Back to Main Page</a>
        </div>

    </div>

</body>
</html>
