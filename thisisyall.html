<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This Is Y'all - Alison & Brian</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            padding: 40px 15px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p.subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 35px;
            font-style: italic;
        }
        .collage-stack {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 40px;
        }
        .collage-card {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(26, 43, 76, 0.08);
            border: 1px solid #e2ded4;
        }
        .collage-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        .btn-back {
            display: inline-block;
            color: #1a2b4c;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
            padding: 10px 20px;
            border: 1px solid #1a2b4c;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background-color: #1a2b4c;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>This Is Y'all</h1>
        <p class="subtitle">We are so lucky!</p>

        <div class="collage-stack">
            <!-- 1. Alison and Brian's parents -->
            <div class="collage-card">
                <img src="images/Absparents.png" alt="Alison and Brian's Parents">
            </div>

            <!-- 2. Alison's family -->
            <div class="collage-card">
                <img src="images/Afamily.png" alt="Alison's family">
            </div>

            <!-- 3. Brian's family -->
            <div class="collage-card">
                <img src="images/Bfamily.png" alt="Brian's family">
            </div>

            <!-- 4. Alison's bridal Party 1 -->
            <div class="collage-card">
                <img src="images/Abridalparty1.png" alt="Alison's bridal party 1">
            </div>

            <!-- 5. Alison's bridal Party 2 -->
            <div class="collage-card">
                <img src="images/Abridalparty2.png" alt="Alison's bridal Party 2">
            </div>

            <!-- 6. Brian's bridal party 1 -->
            <div class="collage-card">
                <img src="images/Bsbridalparty.png" alt="Brian's bridal party 1">
            </div>

            <!-- 7. Brian's bridal party 2 -->
            <div class="collage-card">
                <img src="images/Bsbridalparty2.png" alt="Brian's bridal party 2">
            </div>

            <!-- 8. Extended family -->
            <div class="collage-card">
                <img src="images/abextendedfamily.png" alt="Alison and Brian's extended family">
            </div>
        </div>

        <div>
            <a href="index.html" class="btn-back">&larr; Back to Main Page</a>
        </div>
    </div>

</body>
</html>
