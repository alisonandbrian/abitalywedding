<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Alison & Brian</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            padding: 40px 15px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p.subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 35px;
            font-style: italic;
        }
        .video-stack {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 40px;
        }
        .video-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(26, 43, 76, 0.08);
            border: 1px solid #e2ded4;
        }
        .video-card h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #1a2b4c;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .btn-back {
            display: inline-block;
            color: #1a2b4c;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 20px;
            border: 1px solid #1a2b4c;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background-color: #1a2b4c;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Videos</h1>
        <p class="subtitle">A few special moments captured on film ✨</p>

        <div class="video-stack">
            <div class="video-card">
                <h3>Engagement Party Video</h3>
                <div class="video-wrapper">
                    <!-- Replace YOUR_FILE_ID with your Google Drive file ID -->
                    <iframe src="https://drive.google.com/file/d/YOUR_FILE_ID/preview" allow="autoplay" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <div>
            <a href="index.html" class="btn-back">&larr; Back to Main Page</a>
        </div>
    </div>

</body>
</html>
