<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Alison & Brian</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            padding: 40px 15px 80px 15px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p.subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 35px;
            font-style: italic;
        }
        .video-stack {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 40px;
        }
        .video-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(26, 43, 76, 0.08);
            border: 1px solid #e2ded4;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }
        .video-card h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .video-fallback {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #666;
        }
        .video-fallback a {
            color: #1a2b4c;
            font-weight: 600;
            text-decoration: underline;
            transition: color 0.2s ease;
        }
        .video-fallback a:hover {
            color: #3b5278;
        }
        .btn-back {
            display: inline-block;
            color: #1a2b4c;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 24px;
            border: 1px solid #1a2b4c;
            border-radius: 30px;
            transition: all 0.3s ease;
            background-color: #ffffff;
        }
        .btn-back:hover {
            background-color: #1a2b4c;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>That A&B Party</h1>
        <p class="subtitle">The prelude in Madison, Wisconsin</p>

        <div class="video-stack">
            <!-- First Video Card -->
            <div class="video-card">
                <h3>Engagement Party Video</h3>
                <div class="video-wrapper">
                    <iframe src="https://drive.google.com/file/d/17CeHaB6eYXV7d1fJRTplcgiaGzqc9zaJ/preview" allow="autoplay" allowfullscreen></iframe>
                </div>
                <p class="video-fallback">
                    Just in case the video doesn't work, <a href="https://drive.google.com/file/d/17CeHaB6eYXV7d1fJRTplcgiaGzqc9zaJ/view" target="_blank" rel="noopener noreferrer">click this link to watch it in Google Drive</a>.
                </p>
            </div>

            <!-- Second Video Card -->
            <div class="video-card">
                <h3>Save our Date</h3>
                <div class="video-wrapper">
                    <iframe src="https://drive.google.com/file/d/1sZ_a4AIy0kiAokZjS51775V7oOB7_OJZ/preview" allow="autoplay" allowfullscreen></iframe>
                </div>
                <p class="video-fallback">
                    Just in case the video doesn't work, <a href="https://drive.google.com/file/d/1sZ_a4AIy0kiAokZjS51775V7oOB7_OJZ/view" target="_blank" rel="noopener noreferrer">click this link to watch it in Google Drive</a>.
                </p>
            </div>
        </div>

        <div>
            <a href="index.html" class="btn-back">&larr; Back to Main Page</a>
        </div>
    </div>

</body>
</html>
