<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts &amp; Registry</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            line-height: 1.6;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Image Card */
        .image-card {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(26, 43, 76, 0.08);
            margin-bottom: 30px;
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        /* Back Button */
        .btn-back {
            display: inline-block;
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(26, 43, 76, 0.2);
            transition: transform 0.2s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Gifts Image -->
        <div class="image-card">
            <img src="images/gifts-presence.png" alt="Your presence is our present">
        </div>

        <!-- Back Link -->
        <div>
            <a href="index.html" class="btn-back">&larr; Back to Main Page</a>
        </div>

    </div>

</body>
</html>
