<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alison &amp; Brian - Wedding</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            line-height: 1.6;
            padding: 40px 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .hero-card {
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(26, 43, 76, 0.08);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            color: #1a2b4c;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        p.intro-text {
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.7;
        }

        /* Navigation Links Section */
        .navigation-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 30px auto 0 auto;
        }

        .btn {
            display: block;
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(26, 43, 76, 0.15);
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #3b5278;
        }
/* Container to hold rising bubbles */
#bubble-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
}

/* Individual Champagne Bubbles - Brighter & More Visible */
.bubble {
    position: absolute;
    bottom: -30px;
    background: radial-gradient(circle at 30% 30%, #ffffff, #ffe066 60%, #ffd700);
    border: 1px solid #e6b800;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.8), inset 0 0 6px #ffffff;
    opacity: 0.9; /*set explicit base opacity */
    animation: riseAndSway 10s linear infinite;
}

/* Keyframe for upward floating + gentle sway */
@keyframes riseAndSway {
    0% {
        transform: translateY(0) translateX(0) scale(0.6);
        opacity: 0;
    }
    15% {
        opacity: 0.95;
    }
    50% {
        transform: translateY(-50vh) translateX(25px) scale(1.1);
        opacity: 0.9;
    }
    85% {
        opacity: 0.85;
    }
    100% {
        transform: translateY(-105vh) translateX(-25px) scale(1.3);
        opacity: 0;
    }
}

    </style>
</head>
<body>
<div id="bubble-container"></div>

    <div class="container">
        <!-- Main Announcement Section -->
        <section class="announcement">
            <h1 class="tagline">Pop open the champagne</h1>
            
            <div class="image-card">
                <img src="images/Openingimage.png" alt="We are getting married illustration" style="width: 100%; max-width: 500px; height: auto; display: block; margin: 20px auto;">
            </div>
        </section>

        <!-- Schedule / Itinerary Section -->
        <section class="schedule-section">
            <div class="image-card">
                <img src="images/wedding-schedule.png" alt="Wedding schedule of events - Oct 14 to Oct 16, 2027" style="max-width: 100%; width: 500px; height: auto; display: block; margin: 20px auto;">
            </div>
        </section>

        <!-- Main Navigation & Links Section -->
        <section class="navigation-links">
            <a href="rsvp.html" class="btn btn-primary">RSVP Here</a>
            <a href="this-is-us.html" class="btn">This Is Us</a>
            <a href="videos.html" class="btn">Engagement Party Video</a>
            <a href="location-info.html" class="btn">General Inquiries About Location / Stay</a>
            <a href="dress-code.html" class="btn">View Dress Code &amp; Attire Inspiration</a>
            <a href="food-and-drinks.html" class="btn">Food &amp; Drinks Info</a>
            <a href="gifts.html" class="btn">Gifts &amp; Registry</a>
            <a href="pack-and-prepare.html" class="btn">Pack &amp; Prepare</a>
            <a href="travel-details.html" class="btn">Submit Travel &amp; Flight Info</a>
            <a href="italian-phrases.html" class="btn">Italian Cheat Sheet 🇮🇹</a>
            <a href="bridal-party.html" class="btn">Bridal Party Info; password needed</a>



        </section>
    </div>
    
    <script>
    function createChampagneBubbles() {
        const container = document.getElementById('bubble-container');
        const bubbleCount = 120; // Increased count for many more bubbles

        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');

            // Larger size range (8px to 22px)
            const size = Math.random() * 14 + 8;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;

            // Spread horizontally across the screen
            bubble.style.left = `${Math.random() * 100}%`;

            // Faster speed (3s to 7s) and staggered start delay
            const duration = Math.random() * 4 + 3;
            const delay = Math.random() * 7;

            bubble.style.animationDuration = `${duration}s`;
            bubble.style.animationDelay = `${delay}s`;

            container.appendChild(bubble);
        }
    }

    document.addEventListener('DOMContentLoaded', createChampagneBubbles);
</script>
</body>
</html>
