<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Details - Alison & Brian</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(26, 43, 76, 0.08);
            margin-bottom: 25px;
            text-align: left;
        }

        h1, h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
            color: #1a2b4c;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            background-color: #fff;
        }

        .btn-submit {
            width: 100%;
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #3b5278;
        }

        .btn-back {
            display: inline-block;
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Manifest Table Styles */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        .manifest-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .manifest-table th, 
        .manifest-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: top;
        }

        .manifest-table th {
            background-color: #f7f5f0;
            color: #1a2b4c;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .manifest-table tr:hover {
            background-color: #faf8f5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Travel Details</h1>
            <p class="subtitle">Please share your travel information so we can help coordinate!</p>

            <form id="travelForm" action="https://formspree.io/f/mqpzgoqp" method="POST">
                
                <div class="form-group">
                    <label for="names">Guest Name(s)</label>
                    <input type="text" id="names" name="Guest Names" placeholder="e.g. Jane & John Doe" required>
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

                <!-- ARRIVAL TRANSPORTATION -->
                <div class="form-group">
                    <label for="arrival-mode">Arrival Mode</label>
                    <select id="arrival-mode" name="Arrival Mode" onchange="toggleFields('arrival')">
                        <option value="flight">Flight</option>
                        <option value="train">Train</option>
                        <option value="car">Car / Driving</option>
                    </select>
                </div>

                <div class="form-group" id="arrival-info-group">
                    <label for="arrival-info" id="arrival-info-label">Arrival Flight(s) & Airline</label>
                    <input type="text" id="arrival-info" name="Arrival Info" placeholder="e.g. DL123 (JFK to FCO), DL456 (FCO to PSA)" required>
                </div>

                <div class="form-group" id="arrival-time-group">
                    <label for="arrival-date" id="arrival-date-label">Final Arrival Date & Time</label>
                    <input type="text" id="arrival-date" name="Arrival Time Details" placeholder="e.g. Oct 13 at 2:30 PM (Pisa Airport)" required>
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

                <!-- DEPARTURE TRANSPORTATION -->
                <div class="form-group">
                    <label for="return-mode">Departure Mode</label>
                    <select id="return-mode" name="Return Mode" onchange="toggleFields('return')">
                        <option value="flight">Flight</option>
                        <option value="train">Train</option>
                        <option value="car">Car / Driving</option>
                    </select>
                </div>

                <div class="form-group" id="return-info-group">
                    <label for="return-info" id="return-info-label">Return Flight(s) & Airline</label>
                    <input type="text" id="return-info" name="Return Info" placeholder="e.g. UA789 (PSA to FRA), UA101 (FRA to EWR)" required>
                </div>

                <div class="form-group" id="return-time-group">
                    <label for="return-date" id="return-date-label">Return Departure Date & Time</label>
                    <input type="text" id="return-date" name="Return Time Details" placeholder="e.g. Oct 20 at 10:15 AM (Pisa Airport)" required>
                </div>

                <button type="submit" class="btn-submit">Submit Travel Details</button>
            </form>
        </div>

        <!-- SHARED MANIFEST RESULTS -->
        <div class="card">
            <h2>Guest Travel Manifest</h2>
            <p class="subtitle" style="margin-bottom: 15px;">Check who is traveling around the same dates or taking similar routes!</p>

            <div class="table-container">
                <table class="manifest-table" id="manifestTable">
                    <thead>
                        <tr>
                            <th>Guest(s)</th>
                            <th>Arrival Details</th>
                            <th>Departure Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Guest entries will populate here dynamically upon submission -->
                    </tbody>
                </table>
            </div>
        </div>

        <a href="index.html" class="btn-back">← Back to Main Page</a>
    </div>

    <script>
        function toggleFields(type) {
            const mode = document.getElementById(`${type}-mode`).value;
            const infoGroup = document.getElementById(`${type}-info-group`);
            const timeGroup = document.getElementById(`${type}-time-group`);
            const infoInput = document.getElementById(`${type}-info`);
            const timeInput = document.getElementById(`${type}-date`);
            const infoLabel = document.getElementById(`${type}-info-label`);
            const timeLabel = document.getElementById(`${type}-date-label`);

            const isArrival = type === 'arrival';

            if (mode === 'flight') {
                infoGroup.style.display = 'block';
                timeGroup.style.display = 'block';
                infoInput.required = true;
                timeInput.required = true;
                
                infoLabel.textContent = isArrival ? 'Arrival Flight(s) & Airline' : 'Return Flight(s) & Airline';
                infoInput.placeholder = isArrival ? 'e.g. DL123 (JFK to FCO)' : 'e.g. UA789 (PSA to FRA)';
                
                timeLabel.textContent = isArrival ? 'Final Arrival Date & Time' : 'Return Departure Date & Time';
                timeInput.placeholder = isArrival ? 'e.g. Oct 13 at 2:30 PM (Pisa Airport)' : 'e.g. Oct 20 at 10:15 AM (Pisa Airport)';
            } 
            else if (mode === 'train') {
                infoGroup.style.display = 'block';
                timeGroup.style.display = 'block';
                infoInput.required = false;
                timeInput.required = true;

                infoLabel.textContent = isArrival ? 'Train Station / Route Details' : 'Departure Train Station / Route';
                infoInput.placeholder = isArrival ? 'e.g. Frecciarossa from Rome' : 'e.g. Train to Florence Central';

                timeLabel.textContent = isArrival ? 'Arrival Date & Station Arrival Time' : 'Departure Date & Station Time';
                timeInput.placeholder = isArrival ? 'e.g. Oct 13 at 4:15 PM (Florence Santa Maria Novella)' : 'e.g. Oct 20 at 11:00 AM';
            } 
            else if (mode === 'car') {
                infoGroup.style.display = 'none';
                timeGroup.style.display = 'none';
                infoInput.required = false;
                timeInput.required = false;
                infoInput.value = '';
                timeInput.value = '';
            }
        }

        document.getElementById('travelForm').addEventListener('submit', function(e) {
            const names = document.getElementById('names').value;

            // Get Mode selections
            const arrMode = document.getElementById('arrival-mode').value;
            const retMode = document.getElementById('return-mode').value;

            // Format Arrival string for Manifest
            let arrText = `<strong>${arrMode.toUpperCase()}</strong>`;
            if (arrMode === 'flight') {
                arrText += `<br>${document.getElementById('arrival-info').value}<br><small style="color: #666;">${document.getElementById('arrival-date').value}</small>`;
            } else if (arrMode === 'train') {
                const info = document.getElementById('arrival-info').value;
                if(info) arrText += `<br>${info}`;
                arrText += `<br><small style="color: #666;">${document.getElementById('arrival-date').value}</small>`;
            } else if (arrMode === 'car') {
                arrText += `<br><small style="color: #666;">Driving / Rental Car</small>`;
            }

            // Format Departure string for Manifest
            let retText = `<strong>${retMode.toUpperCase()}</strong>`;
            if (retMode === 'flight') {
                retText += `<br>${document.getElementById('return-info').value}<br><small style="color: #666;">${document.getElementById('return-date').value}</small>`;
            } else if (retMode === 'train') {
                const info = document.getElementById('return-info').value;
                if(info) retText += `<br>${info}`;
                retText += `<br><small style="color: #666;">${document.getElementById('return-date').value}</small>`;
            } else if (retMode === 'car') {
                retText += `<br><small style="color: #666;">Driving / Rental Car</small>`;
            }

            // Populate Manifest Table
            const tbody = document.getElementById('manifestTable').getElementsByTagName('tbody')[0];
            const newRow = tbody.insertRow();

            newRow.insertCell(0).textContent = names;
            newRow.insertCell(1).innerHTML = arrText;
            newRow.insertCell(2).innerHTML = retText;
        });
    </script>

</body>
</html>
