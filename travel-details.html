<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Details - Alison & Brian</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #1a2b4c;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(26, 43, 76, 0.08);
            margin-bottom: 25px;
            text-align: left;
        }

        h1, h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
            color: #1a2b4c;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
        }

        .btn-submit {
            width: 100%;
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #3b5278;
        }

        .btn-back {
            display: inline-block;
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Manifest Table Styles */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        .manifest-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .manifest-table th, 
        .manifest-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: top;
        }

        .manifest-table th {
            background-color: #f7f5f0;
            color: #1a2b4c;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .manifest-table tr:hover {
            background-color: #faf8f5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Travel Details</h1>
            <p class="subtitle">Please share your flight information so we can help coordinate!</p>

            <form id="travelForm" action="https://formspree.io/f/mqpzgoqp" method="POST">
                
                <div class="form-group">
                    <label for="names">Guest Name(s)</label>
                    <input type="text" id="names" name="Guest Names" placeholder="e.g. Jane & John Doe" required>
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

                <!-- ARRIVAL FLIGHT INFORMATION -->
                <div class="form-group">
                    <label for="arrival-flights">Arrival Flight(s) & Airline</label>
                    <input type="text" id="arrival-flights" name="Arrival Flights" placeholder="e.g. DL123 (JFK to FCO), DL456 (FCO to PSA)" required>
                </div>

                <div class="form-group">
                    <label for="arrival-date">Final Arrival Date & Time</label>
                    <input type="text" id="arrival-date" name="Arrival Details" placeholder="e.g. Oct 13 at 2:30 PM (Pisa Airport)" required>
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

                <!-- RETURN FLIGHT INFORMATION -->
                <div class="form-group">
                    <label for="return-flights">Return Flight(s) & Airline</label>
                    <input type="text" id="return-flights" name="Return Flights" placeholder="e.g. UA789 (PSA to FRA), UA101 (FRA to EWR)" required>
                </div>

                <div class="form-group">
                    <label for="return-date">Return Departure Date & Time</label>
                    <input type="text" id="return-date" name="Return Details" placeholder="e.g. Oct 20 at 10:15 AM (Pisa Airport)" required>
                </div>

                <button type="submit" class="btn-submit">Submit Flight Details</button>
            </form>
        </div>

        <!-- SHARED MANIFEST RESULTS -->
        <div class="card">
            <h2>Guest Flight Manifest</h2>
            <p class="subtitle" style="margin-bottom: 15px;">Check who is taking similar connecting flights or traveling on the same dates!</p>

            <div class="table-container">
                <table class="manifest-table" id="manifestTable">
                    <thead>
                        <tr>
                            <th>Guest(s)</th>
                            <th>Arrival Flight(s) & Date</th>
                            <th>Return Flight(s) & Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Guest entries will populate here dynamically upon submission -->
                    </tbody>
                </table>
            </div>
        </div>

        <a href="index.html" class="btn-back">← Back to Main Page</a>
    </div>

    <script>
        document.getElementById('travelForm').addEventListener('submit', function(e) {
            const names = document.getElementById('names').value;
            const arrFlights = document.getElementById('arrival-flights').value;
            const arrivalDate = document.getElementById('arrival-date').value;
            const retFlights = document.getElementById('return-flights').value;
            const returnDate = document.getElementById('return-date').value;

            const tbody = document.getElementById('manifestTable').getElementsByTagName('tbody')[0];
            const newRow = tbody.insertRow();

            newRow.insertCell(0).textContent = names;
            newRow.insertCell(1).innerHTML = `${arrFlights}<br><small style="color: #666;">${arrivalDate}</small>`;
            newRow.insertCell(2).innerHTML = `${retFlights}<br><small style="color: #666;">${returnDate}</small>`;
        });
    </script>

</body>
</html>
